[project]
name = "davincibot-robot"
version = "0.0.0"
description = "DaVinciBot main robot workspace (Coupe de France de Robotique)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dvb-brain",
    "dvb-common-msgs",
    "dvb-lidar",
    "dvb-net",
    "dvb-sim",
    "dvb-supervisor",
    "dvb-usb-com",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dvb-brain = { workspace = true }
dvb-common-msgs = { workspace = true }
dvb-lidar = { workspace = true }
dvb-net = { workspace = true }
dvb-sim = { workspace = true }
dvb-supervisor = { workspace = true }
dvb-usb-com = { workspace = true }

[tool.ruff]
line-length = 100
src = ["packages/*/src"]
extend-exclude = ["*.md"]  # docs snippets are illustrative, aligned by hand

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH", "N"]

[tool.pyright]
include = ["packages", "tools"]
typeCheckingMode = "basic"
strict = ["packages/*/src", "tools/core_check/*.py"]

[tool.importlinter]
root_packages = [
    "dvb_brain",
    "dvb_common_msgs",
    "dvb_lidar",
    "dvb_net",
    "dvb_sim",
    "dvb_supervisor",
    "dvb_usb_com",
]
include_external_packages = true  # needed to forbid editions and asyncio

[[tool.importlinter.contracts]]
name = "The core never imports an edition"
type = "forbidden"
source_modules = [
    "dvb_brain",
    "dvb_common_msgs",
    "dvb_lidar",
    "dvb_net",
    "dvb_sim",
    "dvb_supervisor",
    "dvb_usb_com",
]
forbidden_modules = ["editions"]

[[tool.importlinter.contracts]]
name = "The brain domain stays pure"
type = "forbidden"
source_modules = ["dvb_brain.domain"]
forbidden_modules = ["dvb_brain.services", "dvb_brain.adapters", "dvb_brain.app", "asyncio"]

[tool.pytest.ini_options]
testpaths = ["packages", "tools"]
addopts = ["--import-mode=importlib"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-benchmark>=5.3.1",
    "ruff>=0.17.4",
    "types-shapely>=2.1.0.20261030",
]
